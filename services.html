<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uvosoft Tech | Services</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-black: #030305; --neon-blue: #00F0FF; --neon-pink: #FF0055; --neon-orange: #FF7700; --text-white: #ffffff; --text-gray: #8888aa; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-black); color: var(--text-white); overflow-x: hidden; }
        h1, h2, h3, .nav-logo { font-family: 'Space Grotesk', sans-serif; }
        .cursor-glow { position: fixed; width: 300px; height: 300px; background: radial-gradient(circle, rgba(0, 240, 255, 0.1) 0%, transparent 70%); border-radius: 50%; pointer-events: none; z-index: 100; transform: translate(-50%, -50%); mix-blend-mode: screen; }
        #matrix-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -3; opacity: 0.08; }
        #ai-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; }
        .scanline { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; background: linear-gradient(to bottom, transparent 0%, rgba(0, 240, 255, 0.03) 50%, transparent 100%); background-size: 100% 8px; animation: scanmove 8s linear infinite; }
        .sweep-line { position: fixed; top: -10%; left: 0; width: 100%; height: 200px; background: linear-gradient(to bottom, transparent, rgba(0, 240, 255, 0.05), transparent); z-index: 1; pointer-events: none; animation: sweep 6s ease-in-out infinite; }
        @keyframes scanmove { 0% { background-position: 0 0; } 100% { background-position: 0 100%; } }
        @keyframes sweep { 0% { top: -20%; opacity: 0; } 50% { opacity: 1; } 100% { top: 120%; opacity: 0; } }
        header { position: fixed; width: 100%; top: 0; z-index: 1000; backdrop-filter: blur(15px); background: rgba(3, 3, 5, 0.7); border-bottom: 1px solid rgba(0, 240, 255, 0.1); padding: 1rem 4rem; display: flex; justify-content: space-between; align-items: center; }
        .nav-logo { font-size: 1.4rem; font-weight: 700; text-decoration: none; color: var(--text-white); display: flex; align-items: center; gap: 10px; }
        .logo-dot { width: 10px; height: 10px; background: var(--neon-blue); border-radius: 50%; box-shadow: 0 0 10px var(--neon-blue); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.2); } }
        nav ul { list-style: none; display: flex; gap: 2.5rem; }
        nav a { color: var(--text-gray); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: 0.3s; text-transform: uppercase; }
        nav a:hover { color: var(--neon-blue); text-shadow: 0 0 8px var(--neon-blue); }
        .btn-login { padding: 0.6rem 1.5rem; border: 1px solid var(--neon-blue); background: transparent; color: var(--neon-blue); border-radius: 4px; cursor: pointer; transition: 0.3s; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 0.9rem; }
        .btn-login:hover { background: var(--neon-blue); color: var(--bg-black); box-shadow: 0 0 15px var(--neon-blue); }
        section.content-section { padding: 8rem 4rem 6rem; position: relative; z-index: 2; }
        .section-title { text-align: center; font-size: 2.5rem; margin-bottom: 1rem; color: var(--text-white); }
        .section-title span { color: var(--neon-blue); }
        .section-subtitle { text-align: center; color: var(--text-gray); max-width: 700px; margin: 0 auto 4rem; }
        .tabs-container { display: flex; justify-content: center; gap: 1rem; margin-bottom: 3rem; flex-wrap: wrap; }
        .tab-btn { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text-gray); padding: 0.8rem 1.5rem; border-radius: 4px; cursor: pointer; transition: 0.3s; font-family: 'Space Grotesk', sans-serif; font-weight: 600; }
        .tab-btn.active, .tab-btn:hover { background: rgba(0, 240, 255, 0.1); border-color: var(--neon-blue); color: var(--neon-blue); box-shadow: 0 0 10px rgba(0, 240, 255, 0.2); }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 2rem; max-width: 1200px; margin: 0 auto; }
        .glass-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); padding: 2rem; border-radius: 8px; backdrop-filter: blur(10px); transition: 0.3s; }
        .glass-card:hover { border-color: var(--neon-blue); transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .glass-card h3 { color: var(--neon-blue); margin-bottom: 1rem; font-size: 1.2rem; }
        .glass-card p { color: var(--text-gray); font-size: 0.95rem; line-height: 1.6; }
        .fab-container { position: fixed; bottom: 30px; right: 30px; z-index: 9999; display: flex; flex-direction: column; gap: 15px; }
        .fab { width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0px 4px 10px rgba(0,0,0,0.5); transition: transform 0.3s; text-decoration: none; }
        .fab:hover { transform: scale(1.1); }
        .fab-whatsapp { background: #25D366; } .fab-linkedin { background: #0A66C2; }
        .fab-chatbot { background: linear-gradient(135deg, var(--neon-blue), var(--neon-pink)); position: relative; }
        .fab-chatbot::after { content: ''; position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--neon-blue); animation: ripple 2s infinite; }
        @keyframes ripple { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
        .chatbot-window { position: fixed; bottom: 100px; right: 30px; width: 350px; height: 450px; background: rgba(3, 3, 5, 0.95); border: 1px solid var(--neon-blue); border-radius: 10px; backdrop-filter: blur(20px); box-shadow: 0 0 30px rgba(0, 240, 255, 0.1); z-index: 9998; display: none; flex-direction: column; overflow: hidden; }
        .chat-header { background: rgba(0, 240, 255, 0.05); padding: 15px; border-bottom: 1px solid rgba(0, 240, 255, 0.2); }
        .chat-header h4 { margin: 0; font-family: 'Space Grotesk', sans-serif; color: var(--neon-blue); font-size: 1.1rem; }
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .chat-msg { max-width: 80%; padding: 10px 15px; border-radius: 15px; font-size: 0.9rem; line-height: 1.4; }
        .bot-msg { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text-white); align-self: flex-start; }
        .user-msg { background: linear-gradient(135deg, var(--neon-blue), var(--neon-pink)); color: var(--bg-black); align-self: flex-end; font-weight: 500; }
        .chat-input-area { padding: 15px; border-top: 1px solid rgba(255, 255, 255, 0.1); display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 5px; padding: 10px; color: var(--text-white); outline: none; font-family: 'Inter', sans-serif; }
        .chat-input-area button { background: var(--neon-blue); color: var(--bg-black); border: none; padding: 0 15px; border-radius: 5px; cursor: pointer; font-weight: 700; }
        @media (max-width: 768px) { header { padding: 1rem 1.5rem; } nav ul { display: none; } section.content-section { padding: 6rem 1.5rem 4rem; } }
    </style>
</head>
<body>

    <section id="services" class="content-section">

    <div class="fab-container">
        <div class="fab fab-chatbot" onclick="toggleChatbot()"><svg width="24" height="24" fill="white" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.54.36 2.99.97 4.29L2 22l5.71-.97C9.01 21.64 10.46 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 10.9 13 11.5 13 13h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg></div>
        <a href="https://wa.me/923718055990" target="_blank" class="fab fab-whatsapp"><svg width="24" height="24" fill="white" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.149-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51l-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg></a>

    <div class="chatbot-window" id="chatbotWindow">
        <div class="chat-header"><h4>Uvosoft AI Assistant</h4></div>
        <div class="chat-body" id="chatBody"><div class="chat-msg bot-msg">Hello! I am the Uvosoft AI. How can I help you today?</div></div>
        <div class="chat-input-area"><input type="text" id="chatInput" placeholder="Type your message..." onkeypress="handleKeyPress(event)"><button onclick="sendMessage()">Send</button></div>
    </div>

    <script>
        // --- Cursor Glow ---
        const cursorGlow = document.getElementById('cursorGlow');
        window.addEventListener('mousemove', e => { if(cursorGlow) { cursorGlow.style.left = e.clientX + 'px'; cursorGlow.style.top = e.clientY + 'px'; } });
        
        // --- Chatbot ---
        function toggleChatbot() { const cw = document.getElementById('chatbotWindow'); cw.style.display = cw.style.display === 'flex' ? 'none' : 'flex'; }
        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
        function sendMessage() {
            const input = document.getElementById('chatInput'); const text = input.value.trim().toLowerCase(); if (!text) return;
            const chatBody = document.getElementById('chatBody');
            chatBody.innerHTML += `<div class="chat-msg user-msg">${input.value}</div>`; input.value = ''; chatBody.scrollTop = chatBody.scrollHeight;
            setTimeout(() => {
                let r = "I can answer questions about our IT, Development, Cloud, and Cybersecurity services.";
                if (text.includes('erp')) r = "Our Custom ERP solutions integrate finance, HR, supply chain, and operations seamlessly.";
                else if (text.includes('cyber') || text.includes('security')) r = "We provide elite Cyber Security: Penetration testing, SOC, and Active Directory assessments.";
                else if (text.includes('cloud')) r = "Our Cloud services ensure scalable infrastructure, cost optimization, and MDM/MAM solutions.";
                chatBody.innerHTML += `<div class="chat-msg bot-msg">${r}</div>`; chatBody.scrollTop = chatBody.scrollHeight;
            }, 600);
        }

        // --- Services Data ---
        const services = {
            it: [
                { title: "Local & Remote IT Backoffice Support", desc: "We provide reliable local and remote IT backoffice support to ensure your daily operations run smoothly without interruptions. Our team handles troubleshooting, system maintenance, user support, and technical issue resolution in real time. Whether onsite or remote, we ensure quick response times, minimal downtime, and continuous system performance so your team can focus on core business activities." },
                { title: "Windows / Linux Server Management", desc: "We offer comprehensive Windows and Linux server management services to ensure your IT infrastructure is secure, stable, and efficient. Our expertise includes server setup, virtualization, backup solutions, Active Directory management, file server configuration, and DHCP services. We monitor and maintain your servers to ensure high availability, data security, and optimal performance for your business operations." },
                { title: "Network Support (LAN, WAN, VLANs)", desc: "We provide end-to-end network support services, including LAN and WAN setup, bandwidth management, structured cabling, and advanced configurations for switches, routers, and VLANs. Our solutions are designed to deliver secure, high-speed, and reliable connectivity across your organization." },
                { title: "Firewall Installation & Configuration", desc: "We implement and manage firewall solutions to protect your business from cyber threats and unauthorized access. Our services include firewall installation, configuration, and continuous monitoring to ensure a secure network environment. We design security policies tailored to your business needs, safeguarding your data, systems, and digital assets." },
                { title: "Inventory Management (IT Assets)", desc: "We help businesses efficiently manage their IT assets through organized inventory management systems. Our services include tracking hardware and software assets, maintaining records, and ensuring proper allocation and lifecycle management. This enables better control, cost tracking, and planning for upgrades or replacements." },
                { title: "Onboarding & Software Installation", desc: "We streamline the onboarding process for new employees by setting up devices, user accounts, and required software quickly and efficiently. Our services include system configuration, application installation, and access setup, ensuring every new team member is ready to work from day one with secure and optimized systems." },
                { title: "CCTV & Surveillance Systems", desc: "We provide complete CCTV and surveillance solutions, including installation of NVR/DVR systems, remote monitoring setup, and network camera configuration. Our solutions are designed to enhance security, provide real-time monitoring, and ensure reliable recording and access to footage from anywhere, giving you full control over your premises." },
                { title: "IT Infrastructure Assessment", desc: "We conduct detailed IT infrastructure assessments to evaluate your current systems, identify gaps, and recommend improvements. Our analysis focuses on performance, security, scalability, and cost efficiency, helping you make informed decisions to upgrade and optimize your IT environment." },
                { title: "Cost Optimization", desc: "We help businesses reduce IT expenses by analyzing current resources, identifying inefficiencies, and implementing cost-effective solutions. Our approach ensures optimal utilization of infrastructure, elimination of unnecessary expenses, and improved return on investment without compromising performance or security." },
                { title: "Database Management", desc: "We provide professional database management services to ensure your data is secure, organized, and easily accessible. Our services include database setup, optimization, backup, performance tuning, and maintenance. We ensure high availability, data integrity, and efficient handling of critical business information to support smooth operations and decision-making." }
            ],
            dev: [
                { title: "Business Apps (HRM, HCM, CRM, etc.)", desc: "We develop customized business applications designed to simplify and automate your core operations. Our solutions include HRM, HCM, payroll systems, CRM, asset management, warehouse management, order management, van sales systems, real estate management, and gatekeeper security applications. Each application is built to match your business requirements, improving productivity, accuracy, and control while providing real-time data to support smarter business decisions." },
                { title: "Mobile Applications", desc: "We design and develop high-performance mobile applications that provide seamless user experiences across Android and iOS platforms. Whether you need a customer-facing app or an internal business solution, we create secure, scalable, and user-friendly applications tailored to your needs. Our focus is on performance, usability, and integration, ensuring your mobile app enhances engagement, accessibility, and overall business efficiency." },
                { title: "Website Development", desc: "We create modern, responsive, and visually engaging websites that represent your brand and drive business growth. Our website development services focus on user experience, performance, and SEO optimization to ensure your online presence stands out. Whether it’s a corporate website or a service platform, we build solutions that are fast, secure, and designed to convert visitors into customers." },
                { title: "Webapp Development & Deployment", desc: "We develop powerful web applications that help businesses automate processes, manage data, and deliver services efficiently. From custom dashboards to full-scale enterprise systems, our web apps are built with scalability, security, and performance in mind. We also handle complete deployment, ensuring your application runs smoothly on cloud or on-premises environments, with ongoing support to maintain reliability and growth." }
            ],
            erp: [
                { title: "Enterprise Solutions (Microsoft Dynamics 365, Odoo)", desc: "We provide robust enterprise solutions using platforms like Microsoft Dynamics 365 and Odoo to help businesses streamline operations, integrate departments, and gain real-time insights. Our services include implementation, customization, and ongoing support tailored to your business processes. We ensure seamless integration across finance, sales, operations, and customer management, enabling better decision-making, improved efficiency, and scalable growth for your organization." }
            ],
            cloud: [
                { title: "Cost Optimization", desc: "We help businesses take full control of their cloud spending by analyzing usage, identifying inefficiencies, and implementing smart cost-saving strategies without compromising performance. Our cloud cost optimization services include right-sizing resources, eliminating unused or underutilized services, optimizing storage and compute usage, and applying best practices such as reserved instances and auto-scaling. We continuously monitor your cloud environment to ensure you only pay for what you actually need, improving efficiency, reducing waste, and maximizing the return on your cloud investment while maintaining high availability and performance." },
                { title: "Deployments", desc: "We provide end-to-end cloud deployment services to help businesses build secure, scalable, and high-performance environments tailored to their needs. From planning and architecture design to implementation and configuration, we deploy cloud solutions that support your applications, data, and workflows efficiently. Our services include setting up virtual machines, storage, networking, and access controls while ensuring best practices in security and performance. Whether you are launching a new system or migrating existing infrastructure to the cloud, we ensure a smooth, reliable, and optimized deployment that enables your business to scale and operate with confidence." },
                { title: "Virtualization", desc: "We deliver advanced cloud virtualization solutions that enable businesses to run multiple systems and applications efficiently on shared cloud infrastructure. By creating virtual machines, networks, and storage environments, we help you maximize resource utilization, reduce hardware dependency, and improve scalability. Our services include designing and managing virtual environments, ensuring isolation, security, and high availability for your workloads. With cloud virtualization, we empower your business to operate more flexibly, quickly deploy new systems, and optimize performance while keeping costs under control." },
                { title: "Suite and Email Setup", desc: "We provide complete suite and email setup services to help your business communicate and collaborate efficiently using professional, secure, and reliable platforms. From configuring custom domain emails to setting up tools like business email, calendars, cloud storage, and collaboration apps, we ensure everything is properly integrated and optimized for your workflow. Our services include user account management, security configurations, data migration, and ongoing support, allowing your team to work seamlessly from anywhere while maintaining productivity, organization, and data security." },
                { title: "License and Pricing", desc: "We help businesses choose the right software licenses and pricing models to match their needs while avoiding unnecessary costs. Our service includes analyzing your requirements, recommending the most suitable licensing options, and ensuring compliance with vendor policies. We guide you through subscription plans, user-based and usage-based pricing, and help you optimize costs by selecting only what your business truly needs. With our expertise, you get transparent pricing, better cost control, and scalable licensing solutions that grow with your business." },
                { title: "Backup", desc: "We provide secure and reliable cloud backup solutions to protect your business data from loss, corruption, or cyber threats. Our services include setting up automated backups, ensuring data is regularly and safely stored in the cloud, and implementing recovery strategies for quick restoration in case of any failure or disaster. We design backup systems that are scalable, encrypted, and compliant with best practices, giving you peace of mind that your critical data is always protected, accessible, and recoverable whenever you need it." },
                { title: "Automation", desc: "We deliver cloud automation solutions that streamline your operations by reducing manual tasks and improving efficiency across your infrastructure. Our services include automating deployments, scaling, backups, monitoring, and routine maintenance using modern tools and scripts tailored to your environment. By implementing intelligent automation, we help your business achieve faster deployments, consistent performance, reduced human error, and optimized resource usage—allowing your team to focus on core business activities while your cloud environment runs smoothly and efficiently." },
                { title: "MDM & MAM", desc: "We provide comprehensive Mobile Device Management (MDM) and Mobile Application Management (MAM) solutions to help businesses securely manage and control their mobile workforce. Our services include device enrollment, policy enforcement, remote monitoring, and data protection across smartphones, tablets, and laptops. We ensure that only authorized users and applications can access company resources, while sensitive data remains protected through encryption and access controls. With MDM and MAM, we enable your organization to maintain security, improve productivity, and manage devices and applications efficiently—whether your team is working in the office or remotely." }
            ],
            cyber: [
                { title: "Application Security", desc: "Build secure applications from the ground up with our comprehensive Application Security services. We help organizations identify, assess, and remediate security vulnerabilities across the Software Development Life Cycle (SDLC). Our experts perform secure code reviews, architecture assessments, vulnerability assessments, DevSecOps integration, and security testing to ensure your web, mobile, desktop, and cloud-native applications remain resilient against evolving cyber threats while meeting industry compliance requirements." },
                { title: "Penetration Testing", desc: "Gain a clear understanding of your organization's security posture through expert-led penetration testing. We simulate real-world cyberattacks to identify exploitable vulnerabilities before malicious actors can. Our assessments combine automated tools with in-depth manual testing, delivering actionable findings, risk prioritization, proof of exploitation, and remediation guidance." },
                { title: "Web & Mobile App Pentesting", desc: "Identify security weaknesses in web and mobile applications using industry-recognized methodologies such as the OWASP Web Security Testing Guide. We assess authentication, authorization, business logic, session management, input validation, API integrations, and common web vulnerabilities to strengthen your application's security. For mobile, we evaluate Android and iOS applications against modern mobile threats, covering insecure data storage, reverse engineering, authentication, encryption, API communication, certificate pinning, and runtime security." },
                { title: "API & Cloud Pentesting", desc: "Secure REST, SOAP, and GraphQL APIs by identifying vulnerabilities in authentication, authorization, input validation, rate limiting, business logic, and data exposure. We ensure your APIs remain resilient against unauthorized access and abuse. For cloud, we assess the security of environments across AWS, Microsoft Azure, and Google Cloud Platform. Our cloud penetration testing identifies misconfigurations, privilege escalation paths, exposed services, identity and access management weaknesses, storage security issues, and infrastructure vulnerabilities." },
                { title: "Active Directory (AD) Pentesting", desc: "Protect your enterprise identity infrastructure through comprehensive Active Directory security assessments. We simulate advanced attacker techniques to identify privilege escalation opportunities, insecure configurations, credential exposure, lateral movement paths, and domain compromise risks before they can be exploited." },
                { title: "Database Hardening & Security", desc: "Protect your organization's most valuable asset—its data. Our Database Hardening and Security services strengthen database environments by implementing secure configurations, least-privilege access controls, encryption, auditing, vulnerability assessments, patch management, and continuous monitoring. We secure Microsoft SQL Server, Oracle, MySQL, PostgreSQL, MongoDB, and other database platforms against unauthorized access, data breaches, and compliance risks." },
                { title: "Security Operations Center (SOC) – 24×7", desc: "Monitor, detect, and respond to cyber threats around the clock with our 24×7 Security Operations Center (SOC). Our security analysts provide continuous threat monitoring, log analysis, SIEM management, threat intelligence, endpoint detection and response (EDR), incident triage, and proactive threat hunting. By combining advanced security technologies with expert analysts, we help organizations minimize risk, reduce response times, and maintain uninterrupted business operations." },
                { title: "Incident Response", desc: "Respond quickly and effectively to cybersecurity incidents with our Incident Response services. Our experts help organizations contain threats, investigate security breaches, eradicate malicious activity, recover critical systems, and restore business operations with minimal disruption. We conduct forensic investigations, root cause analysis, malware analysis, evidence preservation, and post-incident reporting while providing strategic recommendations to prevent future attacks." }
            ],
            ai: [
                { title: "AI Engineering & LLMs", desc: "Leverage the power of Artificial Intelligence to drive innovation, automation, and business growth. Our AI Engineering services help organizations design, develop, deploy, and secure AI-powered solutions tailored to their business objectives. We specialize in Generative AI, Large Language Models (LLMs), Retrieval-Augmented Generation (RAG), AI agents, machine learning, intelligent automation, MLOps, and AI integration with enterprise systems. From concept to production, we build scalable, secure, and responsible AI solutions that deliver measurable business value." }
            ]
        };
        function filterServices(category, evt) {
            const grid = document.getElementById('servicesGrid'); grid.innerHTML = '';
            services[category].forEach(s => { grid.innerHTML += `<div class="glass-card"><h3>${s.title}</h3><p>${s.desc}</p></div>`; });
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if(evt) evt.target.classList.add('active');
        }
        filterServices('it'); // Safe to call now without crashing the background!

        // --- Subtle Matrix Rain ---
        const mCanvas = document.getElementById('matrix-canvas'); const mCtx = mCanvas.getContext('2d');
        mCanvas.width = window.innerWidth; mCanvas.height = window.innerHeight;
        let drops = Array(Math.floor(mCanvas.width / 14)).fill(1);
        function drawMatrix() {
            mCtx.fillStyle = 'rgba(3, 3, 5, 0.1)'; mCtx.fillRect(0, 0, mCanvas.width, mCanvas.height);
            mCtx.fillStyle = '#00F0FF'; mCtx.font = '14px monospace';
            for (let i = 0; i < drops.length; i++) { const t = "0123456789</>{}"[(Math.random() * 16) | 0]; mCtx.fillText(t, i * 14, drops[i] * 14); if (drops[i] * 14 > mCanvas.height && Math.random() > 0.975) drops[i] = 0; drops[i]++; }
        }

        // --- 3D Shape Morphing AI Core ---
        const canvas = document.getElementById('ai-canvas'); const ctx = canvas.getContext('2d');
        let w, h, cx, cy, radius;
        function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; cx = w / 2; cy = h / 2; radius = Math.min(w, h) * 0.3; }
        resize();
        const N = 180; let currentShape = [], targetShape = [], morphProgress = 1, restTimer = 0, rotX = 0, rotY = 0, dataPackets = [];
        const palettes = [['#00F0FF', '#FF0055', '#FF7700'], ['#FF0055', '#FF7700', '#00F0FF'], ['#39FF14', '#00F0FF', '#BF00FF'], ['#BF00FF', '#FF0055', '#39FF14']];
        let currentColors = palettes[0]; let targetColors = palettes[1]; let colorProgress = 1;
        function generateSphere() { let p=[]; for(let i=0;i<9;i++) for(let j=0;j<20;j++) { let t=(i/9)*Math.PI, p2=(j/20)*2*Math.PI; p.push({x:radius*Math.sin(t)*Math.cos(p2), y:radius*Math.cos(t), z:radius*Math.sin(t)*Math.sin(p2)}); } return p; }
        function generateInfinity() { let p=[]; for(let i=0;i<N;i++) { let t=(i/N)*2*Math.PI; p.push({x:(radius*0.8+radius*0.3*Math.cos(3*t))*Math.cos(2*t), y:(radius*0.8+radius*0.3*Math.cos(3*t))*Math.sin(2*t), z:radius*0.3*Math.sin(3*t)}); } return p; }
        function generatePolygons() { let p=[]; for(let i=0;i<6;i++) { let y=radius*((i/5)*2-1), r=radius*Math.sin((i/5)*Math.PI); for(let j=0;j<30;j++) { let a=(j/30)*2*Math.PI; p.push({x:r*Math.cos(a), y:y, z:r*Math.sin(a)}); } } return p; }
        function generateRings() { let p=[]; for(let i=0;i<N;i++) { let t=((i%60)/60)*2*Math.PI, r=Math.floor(i/60); if(r===0)p.push({x:radius*Math.cos(t),y:radius*Math.sin(t),z:0}); else if(r===1)p.push({x:radius*Math.cos(t),y:0,z:radius*Math.sin(t)}); else p.push({x:0,y:radius*Math.cos(t),z:radius*Math.sin(t)}); } return p; }
        function getRandomShape() { return [generateSphere, generateInfinity, generatePolygons, generateRings][Math.floor(Math.random()*4)](); }
        currentShape = generateSphere(); targetShape = generateInfinity();
        let connections = []; let lat = 9, lon = 20;
        for (let i = 0; i < lat; i++) { for (let j = 0; j < lon; j++) { let p1 = i * lon + j; connections.push([p1, i * lon + (j + 1) % 20]); if (i < 8) connections.push([p1, (i + 1) * 20 + j]); } }
        function hexToRgb(hex) { return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)]; }
        function lerp(a, b, t) { return a + (b - a) * t; }
        function lerpColor(c1, c2, t) { let r1=hexToRgb(c1), r2=hexToRgb(c2); return `rgb(${Math.round(lerp(r1[0],r2[0],t))},${Math.round(lerp(r1[1],r2[1],t))},${Math.round(lerp(r1[2],r2[2],t))})`; }
        function drawAI() {
            ctx.clearRect(0, 0, w, h); rotX += 0.003; rotY += 0.005;
            if (morphProgress < 1) { morphProgress += 0.008; if (morphProgress >= 1) { morphProgress = 1; restTimer = 0; } } else { restTimer++; if (restTimer > 180) { morphProgress = 0; currentShape = targetShape.map(p => ({ ...p })); targetShape = getRandomShape(); currentColors = [...targetColors]; targetColors = palettes[(palettes.indexOf(targetColors) + 1) % palettes.length]; colorProgress = 0; } }
            if (colorProgress < 1) colorProgress += 0.005;
            let dp = []; for (let i = 0; i < N; i++) dp.push({x:lerp(currentShape[i].x,targetShape[i].x,morphProgress), y:lerp(currentShape[i].y,targetShape[i].y,morphProgress), z:lerp(currentShape[i].z,targetShape[i].z,morphProgress)});
            const projected = dp.map(p => { let cY=Math.cos(rotY),sY=Math.sin(rotY),x1=p.x*cY-p.z*sY,z1=p.x*sY+p.z*cY,cX=Math.cos(rotX),sX=Math.sin(rotX),y1=p.y*cX-z1*sX,z2=p.y*sX+z1*cX,s=400/(400+z2); return {x:cx+x1*s,y:cy+y1*s,z:z2,scale:s}; });
            let lc = lerpColor(currentColors[0], targetColors[0], colorProgress), nc1 = lerpColor(currentColors[1], targetColors[1], colorProgress), nc2 = lerpColor(currentColors[2], targetColors[2], colorProgress);
            connections.forEach(c => { let p1=projected[c[0]],p2=projected[c[1]],o=Math.min(p1.scale,p2.scale)*0.6; ctx.strokeStyle=lc.replace('rgb','rgba').replace(')',`,${o*0.4})`); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke(); });
            projected.forEach((p, i) => { let col = i%2===0?nc1:nc2, rgb=col.match(/\d+/g); ctx.fillStyle=`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${p.scale*0.9})`; ctx.shadowBlur=10; ctx.shadowColor=col; ctx.beginPath(); ctx.arc(p.x,p.y,p.scale*2.5,0,Math.PI*2); ctx.fill(); });
            ctx.shadowBlur=0;
            if (Math.random() > 0.92) { let c = connections[Math.floor(Math.random()*connections.length)]; dataPackets.push({p1:c[0],p2:c[1],t:0,color:currentColors[Math.floor(Math.random()*3)]}); }
            dataPackets.forEach((d, i) => { d.t += 0.05; if (d.t > 1) { dataPackets.splice(i, 1); return; } let p1=projected[d.p1],p2=projected[d.p2]; ctx.fillStyle=d.color; ctx.shadowBlur=15; ctx.shadowColor=d.color; ctx.beginPath(); ctx.arc(p1.x+(p2.x-p1.x)*d.t, p1.y+(p2.y-p1.y)*d.t, 3, 0, Math.PI*2); ctx.fill(); });
            ctx.shadowBlur=0;
        }
        function loop() { drawMatrix(); drawAI(); requestAnimationFrame(loop); }
        window.addEventListener('resize', () => { resize(); drops = Array(Math.floor(mCanvas.width / 14)).fill(1); });
        loop();
    </script>
</body>
</html>
